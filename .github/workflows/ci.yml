name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npx tsc -b

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: build
        run: npm run build
